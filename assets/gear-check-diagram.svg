<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 760" role="img" aria-labelledby="title desc">
  <title id="title">BCD cylinder and wearing check diagram</title>
  <desc id="desc">A labelled diagram showing BCD, cylinder, regulator, SPG, inflator, releases and weights.</desc>
  <style>
    .bg{fill:#f4fbfa}.panel{fill:#fff;stroke:#d8e8e6;stroke-width:2}.gear{fill:#dff1f0;stroke:#173331;stroke-width:6;stroke-linejoin:round}.tank{fill:#d7dde1;stroke:#173331;stroke-width:6}.hose{fill:none;stroke:#173331;stroke-width:7;stroke-linecap:round}.call{fill:#fff8ef;stroke:#d96c52;stroke-width:2}.line{fill:none;stroke:#d96c52;stroke-width:4;stroke-linecap:round}.text{font:700 24px system-ui,sans-serif;fill:#173331}.small{font:600 18px system-ui,sans-serif;fill:#5b6865}.num{font:900 18px system-ui,sans-serif;fill:#fff}.dot{fill:#d96c52}
  </style>
  <rect class="bg" width="1100" height="760"/>
  <text x="42" y="54" class="text">BCD + 气瓶 + 穿着检查 / Kit setup and wearing check</text>
  <text x="42" y="86" class="small">从上到下、从右到左；每个点要“看见 + 摸到 + 功能测试”。</text>

  <g transform="translate(350 115)">
    <rect class="tank" x="155" y="0" width="150" height="485" rx="58"/>
    <rect class="tank" x="191" y="-38" width="78" height="58" rx="18"/>
    <path class="gear" d="M95 115c-42 44-62 114-58 208 4 102 54 181 110 218h60V352h47v189h58c57-37 107-116 111-218 4-94-16-164-58-208l-61 58v116h-151V173z"/>
    <rect class="gear" x="105" y="205" width="250" height="48" rx="18"/>
    <rect class="gear" x="90" y="386" width="280" height="48" rx="16"/>
    <path class="hose" d="M231 5c-126 55-177 121-153 201"/>
    <path class="hose" d="M246 4c115 45 165 105 151 188"/>
    <circle class="gear" cx="70" cy="210" r="36"/>
    <circle class="gear" cx="398" cy="198" r="34"/>
    <path class="hose" d="M251 6c-30 140 28 198 130 260"/>
    <rect class="gear" x="372" y="250" width="70" height="38" rx="16"/>
    <path class="hose" d="M209 15c-120 165-97 315-20 406"/>
    <circle class="gear" cx="178" cy="436" r="33"/>
    <circle class="dot" cx="230" cy="-7" r="14"/><text x="224" y="-1" class="num">1</text>
    <circle class="dot" cx="68" cy="210" r="14"/><text x="62" y="216" class="num">2</text>
    <circle class="dot" cx="397" cy="198" r="14"/><text x="391" y="204" class="num">3</text>
    <circle class="dot" cx="408" cy="271" r="14"/><text x="402" y="277" class="num">4</text>
    <circle class="dot" cx="230" cy="229" r="14"/><text x="224" y="235" class="num">5</text>
    <circle class="dot" cx="230" cy="408" r="14"/><text x="224" y="414" class="num">6</text>
    <circle class="dot" cx="178" cy="436" r="14"/><text x="172" y="442" class="num">7</text>
  </g>

  <g transform="translate(42 130)">
    <rect class="call" width="285" height="82" rx="10"/><text x="18" y="32" class="text">1 气瓶阀 / SPG</text><text x="18" y="60" class="small">全开、压力稳定、无异味</text><path class="line" d="M285 42 C360 28 430 18 505 100"/>
    <rect class="call" y="105" width="285" height="82" rx="10"/><text x="18" y="137" class="text">2 主二级</text><text x="18" y="165" class="small">吸气顺畅，purge 正常</text><path class="line" d="M285 146 C335 148 375 150 418 195"/>
    <rect class="call" y="210" width="285" height="82" rx="10"/><text x="18" y="242" class="text">5 BCD / 气瓶带</text><text x="18" y="270" class="small">充排气、保气、气瓶不滑</text><path class="line" d="M285 250 C385 250 440 250 575 342"/>
    <rect class="call" y="315" width="285" height="82" rx="10"/><text x="18" y="347" class="text">6 快卸扣具</text><text x="18" y="375" class="small">肩扣、胸扣、腰扣可操作</text><path class="line" d="M285 355 C410 405 500 430 580 520"/>
  </g>

  <g transform="translate(774 170)">
    <rect class="call" width="285" height="82" rx="10"/><text x="18" y="32" class="text">3 备用二级</text><text x="18" y="60" class="small">位置可见，能立刻拿到</text><path class="line" d="M0 42 C-60 62 -105 78 -158 144"/>
    <rect class="call" y="105" width="285" height="82" rx="10"/><text x="18" y="137" class="text">4 低压充气管</text><text x="18" y="165" class="small">连接牢，不卡、不自充</text><path class="line" d="M0 146 C-50 151 -90 156 -126 200"/>
    <rect class="call" y="210" width="285" height="82" rx="10"/><text x="18" y="242" class="text">7 配重</text><text x="18" y="270" class="small">数量、平衡、快卸方向</text><path class="line" d="M0 250 C-120 295 -230 325 -247 382"/>
    <rect class="call" y="315" width="285" height="82" rx="10"/><text x="18" y="347" class="text">最终检查</text><text x="18" y="375" class="small">面镜、脚蹼、电脑表、SMB</text>
  </g>
</svg>
